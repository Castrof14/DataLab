<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>E-mail verificado · DataLab</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%221%22 width=%2214%22 height=%2214%22 rx=%223%22 fill=%22%230a0a0a%22 stroke=%22%23fff%22/%3E%3Crect x=%224%22 y=%227%22 width=%228%22 height=%222%22 fill=%22%23ff7a17%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono&family=Inter:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .verified { max-width: 440px; text-align: center; display: grid; gap: 16px; justify-items: center; }
    .verified__mark { width: 44px; height: 44px; border-radius: 50%; background: #7ee0a1; display: grid; place-items: center; color: #0a0a0a; font-size: 24px; line-height: 1; }
    .verified.is-error .verified__mark { background: #ff7a17; }
    .verified h1 { font-weight: 400; font-size: 32px; line-height: 1.15; margin: 0; }
    .verified p { margin: 0; color: var(--mute, #9a9a9a); }
  </style>
</head>
<body>
  <!-- the e-mail confirmation link of Supabase Auth lands here (emailRedirectTo in auth-service.js).
       The address is already confirmed by Supabase before the redirect; this page only says so, or
       shows the error Supabase sent back (expired / already used link). -->
  <main class="verified" id="box">
    <span class="verified__mark" id="mark" aria-hidden="true">✓</span>
    <p class="eyebrow-sm">DataLab · Conta</p>
    <h1 id="title">E-mail verificado.</h1>
    <p id="text">Sua conta está confirmada. Agora é só entrar no jogo com o seu e-mail e senha.</p>
    <a class="btn btn--primary" href="jogo.html">Entrar no jogo</a>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
      var err = q.get('error_description') || q.get('error');
      // drop the code / tokens from the address bar either way
      history.replaceState(null, '', location.pathname);
      if (!err) return;
      document.getElementById('box').classList.add('is-error');
      document.getElementById('mark').textContent = '!';
      document.getElementById('title').textContent = 'Link inválido ou expirado.';
      document.getElementById('text').textContent = 'Este link de confirmação já foi usado ou expirou. Se você já confirmou, é só entrar. Se não, entre no jogo e peça um novo e-mail de confirmação.';
    })();
  </script>
</body>
</html>
