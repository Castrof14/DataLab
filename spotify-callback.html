<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spotify · DataLab</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <!-- the authorization code is in this page's URL: never leak it to another site -->
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://accounts.spotify.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%221%22 width=%2214%22 height=%2214%22 rx=%223%22 fill=%22%230a0a0a%22 stroke=%22%23fff%22/%3E%3Crect x=%224%22 y=%227%22 width=%228%22 height=%222%22 fill=%22%23ff7a17%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono&family=Inter:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .verified { max-width: 440px; text-align: center; display: grid; gap: 16px; justify-items: center; }
    .verified__mark { width: 44px; height: 44px; border-radius: 50%; background: #1ed760; display: grid; place-items: center; color: #0a0a0a; font-size: 24px; line-height: 1; }
    .verified.is-error .verified__mark { background: #ff7a17; }
    .verified h1 { font-weight: 400; font-size: 32px; line-height: 1.15; margin: 0; }
    .verified p { margin: 0; color: var(--mute, #9a9a9a); }
  </style>
</head>
<body>
  <!-- Spotify's login (popup opened by the in-game player) lands here: services/spotify-service.js
       swaps the code for tokens; the game tab picks them up and this window closes itself. -->
  <main class="verified" id="box">
    <span class="verified__mark" id="mark" aria-hidden="true">…</span>
    <p class="eyebrow-sm">DataLab · Spotify</p>
    <h1 id="title">Conectando…</h1>
    <p id="text">Só um instante.</p>
    <a class="btn btn--primary" id="back" href="jogo.html" hidden>Voltar ao jogo</a>
  </main>
  <script src="assets/js/supabase/config.js"></script>
  <script src="assets/js/services/spotify-service.js"></script>
  <script src="assets/js/spotify-callback.js"></script>
</body>
</html>
