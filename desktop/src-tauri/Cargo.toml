[package]
name = "datalab-desktop"
version = "0.9.0"
description = "DataLab para desktop: o jogo numa janela própria e o personagem em segundo plano no canto da tela"
edition = "2021"
publish = false

[lib]
name = "datalab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
